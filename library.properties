sentence=Easy CSV data logger for SD cards: header, time, file rotation, safe flush and clear tips (ru/kk/en), no dependencies.
paragraph=Writes sensor readings to a CSV file on an SD card in three lines: setColumns(), add() for each value and save(). Writes the header once, adds a time column (uptime or your own RTC text), starts a new file when the old one gets big, continues in the last file after a restart, flushes on a timer so the card does not wear out and recovers when the card is pulled out and put back. Explains problems in Russian, Kazakh or English. Needs only the built-in SD library. Made for classes and kits by Alash Electronics.
category=Data Storage
url=https://github.com/Alash-electronics/AlashLogger
architectures=*
includes=AlashLogger.h
depends=SD
